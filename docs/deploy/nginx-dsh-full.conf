# dsh.cbnac.com — dsh 社区主配置(HTTPS + WebSocket 网关)
# HTTP → HTTPS
server {
    listen 80;
    server_name dsh.cbnac.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://dsh.cbnac.com$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name dsh.cbnac.com;

    ssl_certificate /etc/letsencrypt/live/dsh.cbnac.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsh.cbnac.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 远程连接 WebSocket 网关(dsh-link-plugin)
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # 静态资源
    location /_next/static {
        proxy_pass http://127.0.0.1:3002;
        expires 365d;
        access_log off;
    }

    # UI 截图(deepseek-eye 检查用)
    location /shots/ {
        alias /www/wwwroot/cbnac.com/dsh-site/shots/;
    }

    # 主站
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}