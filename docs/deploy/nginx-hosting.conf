# 托管实例子域:u1/u2/u3.dsh.cbnac.com → 3101/3102/3103
# 前置:用户域名 DNS 加通配符 A 记录 *.dsh.cbnac.com → 47.98.207.149
# 证书:certbot HTTP-01 为 u1/u2/u3 各签一份
#
# 2026-08-17 修复 dsh /api 403:
# - Host 改为 127.0.0.1:端口(settings/credentials 等宿主特权接口要求 Host 必须是本机绑定地址)
# - Origin 置空(带外部 Origin 会触发 browser-trust fence 拒绝)
# 配套:镜像 entrypoint 传 --trusted-host <子域>(普通接口的信任围栏)

# HTTP:acme 验证 + 跳转
server {
    listen 80;
    server_name *.dsh.cbnac.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# u1
server {
    listen 443 ssl http2;
    server_name u1.dsh.cbnac.com;
    ssl_certificate     /etc/letsencrypt/live/u1.dsh.cbnac.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/u1.dsh.cbnac.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host 127.0.0.1:3101;
        proxy_set_header Origin "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # 往实例页面注入控制条(重启/升级/联系解决),脚本位于 dsh.cbnac.com 静态目录
        sub_filter_once on;
        sub_filter '</head>' '<script defer src="https://dsh.cbnac.com/ctrl/ctrl-bar.js"></script></head>';
        sub_filter_types text/html;
    }
}

